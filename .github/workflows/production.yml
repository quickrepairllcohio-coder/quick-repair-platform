name: Quick Repair Production Release Gate

on:
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run staging:config-check
      - run: npm run staging:e2e-check
      - run: npm run production:mobile-check
